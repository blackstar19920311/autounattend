name: Repair generator compatibility\n\non:\n  push:\n    branches: [fix/full-audit-remediation]\n\njobs:\n  repair:\n    if: github.actor != 'github-actions[bot]'\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: fix/full-audit-remediation\n          fetch-depth: 0\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.x'\n      - name: Apply implementation-only compatibility fixes\n        run: python scripts/repair-generator-compat.py\n      - name: Commit and push the actual source fix\n        run: |\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add src/utils/generateXml.js\n          git diff --cached --quiet && exit 0\n          git commit -m 'fix(generator): resolve winget, product key, and XML control chars'\n          git push origin HEAD:fix/full-audit-remediation\n