name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A tesztek csak a beépített node:test futtatót használják, nincs
      # szükségük telepített csomagokra – így a build lánctól függetlenül futnak.
      - name: Run unit tests
        run: npm test

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
